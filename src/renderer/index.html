<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>护眼助手</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <header>
    <div class="brand">
      <h1>护眼助手</h1>
      <span id="version" class="version"></span>
    </div>
    <span id="status" class="status">已启用</span>
  </header>

  <main>
    <section>
      <h2>色温</h2>
      <input type="range" id="temperature" min="2000" max="6500" step="100" value="6500" />
      <div class="row">
        <span class="value"><span id="temperature-value">6500</span> K</span>
        <span class="hint">6500K = 原色</span>
      </div>
      <div class="presets">
        <button data-k="4500">办公 4500K</button>
        <button data-k="3400">健康 3400K</button>
        <button data-k="2700">夜晚 2700K</button>
        <button data-k="6500">关闭</button>
      </div>
      <p id="temp-note" class="note hidden"></p>
    </section>

    <section>
      <h2>亮度</h2>
      <input type="range" id="brightness" min="50" max="100" step="1" value="100" />
      <div class="row">
        <span class="value"><span id="brightness-value">100</span> %</span>
        <span class="hint">最低 50%</span>
      </div>
    </section>

    <section>
      <h2>休息提醒</h2>
      <label class="check-row">
        <input type="checkbox" id="break-enabled" checked />
        <span>启用定时休息提醒</span>
      </label>
      <div class="field-row">
        <label class="field">工作
          <input type="number" id="break-work" min="1" max="240" step="1" value="40" />
          分钟
        </label>
        <label class="field">休息
          <input type="number" id="break-rest" min="5" max="3600" step="1" value="300" />
          秒
        </label>
      </div>
      <div class="field-row">
        <label class="field">提醒样式
          <select id="break-style">
            <option value="gentle">温和卡片（默认）</option>
            <option value="fullscreen">全屏遮罩（强制）</option>
          </select>
        </label>
      </div>
      <div class="presets">
        <button id="preset-2020">20-20-20 规则</button>
        <button id="break-pause">暂停提醒 1 小时</button>
      </div>
      <p id="break-note" class="note hidden"></p>
    </section>

    <section>
      <h2>通用</h2>
      <label class="check-row">
        <input type="checkbox" id="auto-launch" />
        <span>开机自启动（启动后驻留托盘）</span>
      </label>
      <p class="placeholder">全局热键：Ctrl+Alt+↑ / Ctrl+Alt+↓ 调节色温（±200K）</p>
    </section>
  </main>

  <script src="index.js"></script>
</body>
</html>
