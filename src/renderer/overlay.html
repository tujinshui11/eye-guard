<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: transparent;
      pointer-events: none;
      overflow: hidden;
    }
    #mask {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0);
      transition: background 0.12s ease-out;
    }
  </style>
</head>
<body>
  <div id="mask"></div>
  <script>
    window.setMaskAlpha = function (a) {
      document.getElementById('mask').style.background = 'rgba(0,0,0,' + a + ')';
    };
  </script>
</body>
</html>
