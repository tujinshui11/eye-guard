name: build

on:
  push:
    branches: [master, rust]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: frontend contract test
        run: node --test tests/theme.test.js

  build:
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: build release
        run: cargo build --release --manifest-path src-tauri/Cargo.toml
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eye-guard-windows-preview
          path: src-tauri/target/release/eye-guard.exe
          if-no-files-found: error

  # tag v* 时：NSIS 安装器（内嵌 WebView2 bootstrapper）+ 便携 zip → GitHub Release
  # 注意：不用 tauri-action（其依赖 npm 生态；本工程为纯 cargo 前端静态目录）
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cache tauri CLI
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri.exe
          key: tauri-cli-windows-x64
      - name: install tauri CLI (cached)
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:USERPROFILE\.cargo\bin\tauri.exe")) {
            cargo install tauri-cli --locked
          }
      - name: build NSIS bundle
        working-directory: src-tauri
        run: cargo tauri build
      - name: assemble portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "src-tauri/target/release/eye-guard.exe" dist/
          @"
          护眼助手 便携版使用说明
          ========================
          1. 双击 eye-guard.exe 直接运行（无需安装、无后台服务）。
          2. 若启动后白屏：系统缺少 WebView2 运行时——请运行本目录的
             MicrosoftEdgeWebView2Setup.exe 一键补装后重试。
             或访问 https://developer.microsoft.com/microsoft-edge/webview2/ 手动安装。
          3. 数据位置：%APPDATA%\护眼助手\（设置与屏幕备份）。
          4. 与旧版（Electron）不能同时运行——请先退出旧版再启动本版。
          "@ | Out-File -Encoding utf8 dist/使用说明.txt
          try {
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "dist/MicrosoftEdgeWebView2Setup.exe" -UseBasicParsing
          } catch {
            Write-Warning "WebView2 bootstrapper 下载失败（zip 仍可用——使用说明含手动安装链接）"
          }
          Compress-Archive -Path dist/* -DestinationPath "eye-guard-${{ github.ref_name }}-portable.zip" -Force
          Get-ChildItem "eye-guard-*.zip"
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          name: "护眼助手 ${{ github.ref_name }}"
          body: |
            ## 护眼助手 ${{ github.ref_name }}（Rust/Tauri 重写版）

            - **NSIS 安装器**（`*setup.exe`）：双击安装；内置 WebView2 bootstrapper——目标机器缺组件时自动补装。
            - **便携版 zip**：解压即用；包内含使用说明与 WebView2 离线补装引导。
            - 与旧版（Electron）**不能同时运行**，切换前请先退出旧版。
          draft: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            eye-guard-*.zip
