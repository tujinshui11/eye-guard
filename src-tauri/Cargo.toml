[package]
name = "eye-guard"
version = "0.3.0"
description = "护眼助手：屏幕色温/亮度调节 + 定时休息提醒（Windows 桌面）"
edition = "2021"
license = "MIT"

[lib]
name = "eye_guard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
encoding_rs = "0.8"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
base64 = "0.22"
chrono = "0.4.45"

# ---- 平台专属依赖 ----
# Windows：Win32 API（gamma / WMI 背光 / Shell 图标 / 前台窗口 / 空闲检测）
[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.6"
windows = { version = "0.62.2", features = ["Win32_Graphics_Gdi", "Win32_Foundation", "Win32_UI_ColorSystem", "Devices_Sensors", "Win32_System_Wmi", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_SystemInformation", "Win32_System_Rpc", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
nokhwa = { version = "0.10.11", features = ["input-native", "nokhwa-bindings-windows", "rgb"] }

# macOS：CoreGraphics（gamma）/ IOKit（背光）/ objc2（前台应用、空闲）
# 说明：实现待补（需 macOS 环境验证）；依赖声明先行，保证 CI 可在 macos runner 上编译
[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
